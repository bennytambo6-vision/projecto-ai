
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>JAQUES AI - Robot Core</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #020617;
            color: #06b6d4;
            font-family: 'Roboto Mono', monospace;
            overflow: hidden;
            height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        
        /* Enhanced Scanlines with Animation */
        .hud-scanline {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.04));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        @keyframes scanline-move {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanning-bar {
            position: absolute;
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, transparent, rgba(6, 182, 212, 0.1), transparent);
            animation: scanline-move 8s linear infinite;
            pointer-events: none;
        }

        .glow-blue {
            filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.8));
        }
        
        /* Dynamic Lens Flare */
        @keyframes flare-pulse {
            0%, 100% { opacity: 0.3; transform: scaleX(1); }
            50% { opacity: 0.7; transform: scaleX(1.2); }
        }
        .lens-flare-dynamic {
            background: linear-gradient(90deg, transparent 0%, rgba(6, 182, 212, 0.05) 40%, rgba(255, 255, 255, 0.8) 50%, rgba(6, 182, 212, 0.05) 60%, transparent 100%);
            height: 1px;
            width: 200%;
            position: absolute;
            top: 50%;
            left: -50%;
            transform: translateY(-50%);
            z-index: 5;
            pointer-events: none;
            mix-blend-mode: screen;
            animation: flare-pulse 4s ease-in-out infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.33); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .pulse-ring-active {
            animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }

        @keyframes slide-up {
            from { transform: translateY(50px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .text-gold {
            color: #facc15;
            text-shadow: 0 0 15px rgba(250, 204, 21, 0.6);
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(6, 182, 212, 0.15);
        }

        /* Glitch Effect */
        @keyframes glitch {
            0% { clip: rect(44px, 9999px, 56px, 0); transform: skew(0.55deg); }
            5% { clip: rect(62px, 9999px, 100px, 0); transform: skew(0.2deg); }
            10% { clip: rect(2px, 9999px, 50px, 0); transform: skew(0.1deg); }
            15% { clip: rect(10px, 9999px, 30px, 0); transform: skew(0.9deg); }
            20% { clip: rect(0, 0, 0, 0); }
        }
        .glitch-active {
            animation: glitch 2s infinite linear alternate-reverse;
        }

        /* Chromatic Aberration */
        .chromatic {
            text-shadow: 2px 0 0 rgba(255,0,0,0.4), -2px 0 0 rgba(0,255,255,0.4);
        }

        /* Custom Scrollbar for HUD logs */
        .custom-scrollbar::-webkit-scrollbar {
            width: 2px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(6, 182, 212, 0.3);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                console.log('Service Worker registrado com sucesso:', reg);
            }).catch(err => {
                console.log('Falha ao registrar Service Worker:', err);
            });
        });
    }
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
